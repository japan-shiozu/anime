<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>平成・令和アニメクイズ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{

  box-sizing:border-box;

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#16161c;--fg:#f1efe8;--muted:#9b9ba6;--card:#22222b;--line:#34343f;--ok:#4cc27c;--ng:#ff6b5e}
}
:root[data-theme="dark"]{--bg:#16161c;--fg:#f1efe8;--muted:#9b9ba6;--card:#22222b;--line:#34343f;--ok:#4cc27c;--ng:#ff6b5e}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.7}
.bars{display:flex;height:10px}
.bars i{flex:1}
.bars i:nth-child(1){background:var(--bar1)}.bars i:nth-child(2){background:var(--bar2)}.bars i:nth-child(3){background:var(--bar3)}
.bars i:nth-child(4){background:var(--bar4)}.bars i:nth-child(5){background:var(--bar5)}.bars i:nth-child(6){background:var(--bar6)}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(28px,8vw,44px);font-weight:900;line-height:1.2;margin:8px 0 12px;letter-spacing:.02em}
.lead{color:var(--muted);margin:0 0 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--bar6);outline-offset:2px}
.start{background:var(--fg);color:var(--bg);border:0;border-radius:6px;padding:14px 28px;font-weight:700;font-size:18px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:10px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:24px}
.prog div{height:100%;background:var(--bar6);width:0;transition:width .3s}
.q{font-size:clamp(20px,5.4vw,26px);font-weight:700;line-height:1.5;margin:0 0 20px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:14px 16px;font-size:17px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 14%,var(--card))}
.fb{margin-top:18px;padding:14px 16px;border-left:5px solid var(--line);background:var(--card);border-radius:0 8px 8px 0}
.fb.ok{border-color:var(--ok)}.fb.ng{border-color:var(--ng)}
.fb b{display:block;margin-bottom:2px}
.fb small{color:var(--muted)}
.next{margin-top:16px;background:var(--fg);color:var(--bg);border:0;border-radius:6px;padding:12px 24px;font-weight:700}
.score{font-size:clamp(64px,20vw,110px);font-weight:900;line-height:1;margin:6px 0}
.score span{font-size:.35em;color:var(--muted);font-weight:700}
.rank{font-size:22px;font-weight:900;margin:8px 0 6px}
.hidden{display:none}
.rv{margin-top:32px}
.rv h2{font-size:20px;font-weight:900;margin:0 0 12px}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:0 8px 8px 0;padding:14px 16px;margin-bottom:12px}
.item.ok{border-left-color:var(--ok)}.item.ng{border-left-color:var(--ng)}
.item .st{font-weight:900;font-size:14px}
.item.ok .st{color:var(--ok)}.item.ng .st{color:var(--ng)}
.item .qq{margin:4px 0 8px;font-weight:700}
.item dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px}
.item dt{color:var(--muted)}.item dd{margin:0}
.item .nt{color:var(--muted);font-size:14px;margin:8px 0 0}
.item a{display:inline-block;margin-top:8px;color:var(--fg);font-weight:700;text-underline-offset:3px}
.item a:focus-visible{outline:3px solid var(--bar6);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<main>
  <section id="intro">
    <h1>平成・令和<br>アニメクイズ</h1>
    <p class="lead">1989年から現在までのアニメ作品から50作品それぞれに3種類の問題があり、その中から10問を出題します。4択で答えてください。出題と選択肢は毎回入れ替わります。</p>
    <button class="start" id="start">はじめる</button>
  </section>

  <section id="quiz" class="hidden">
    <div class="top"><span id="num"></span><span id="pt"></span></div>
    <div class="prog"><div id="bar"></div></div>
    <p class="q" id="q"></p>
    <div class="opts" id="opts"></div>
    <div id="fb"></div>
  </section>

  <section id="result" class="hidden">
    <p class="lead" style="margin-bottom:0">結果</p>
    <div class="score"><b id="sc"></b><span> / 10</span></div>
    <p class="rank" id="rank"></p>
    <p class="lead" id="comment"></p>
    <button class="start" id="again">もう一度</button>
    <div class="rv"><h2>答え合わせ</h2><div id="review"></div></div>
  </section>
</main>

  $("pt").textContent=`正解 ${score}`;
  $("bar").style.width=(i/qs.length*100)+"%";
  $("q").textContent=d.q;
  $("fb").innerHTML="";
  const box=$("opts");box.innerHTML="";
  shuffle(d.o).forEach(t=>{
    const b=document.createElement("button");
    b.className="opt";b.textContent=t;
    b.onclick=()=>answer(b,t);
    box.appendChild(b);
  });
}
function answer(btn,t){
  const d=qs[i],right=t===d.a;
  if(right)score++;
  hist.push({d,picked:t,right});
  [...$("opts").children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===d.a)b.classList.add("ok");
  });
  if(!right)btn.classList.add("ng");
  $("pt").textContent=`正解 ${score}`;
  const last=i===qs.length-1;
  $("fb").innerHTML=`<div class="fb ${right?"ok":"ng"}"><b>${right?"正解です":"不正解です。答えは「"+d.a+"」"}</b><small>${d.n}</small></div><button class="next" id="nx">${last?"結果を見る":"次の問題"}</button>`;
  $("nx").focus();
  $("nx").onclick=()=>{i++;i<qs.length?render():finish()};
}
function finish(){
  show("result");
  $("sc").textContent=score;
  const r=score>=9?["アニメ博士","ほぼ完璧です。どの時代の作品にも詳しいですね。"]
   :score>=7?["アニメ通","かなりの知識です。見逃した作品があればぜひ。"]
   :score>=5?["アニメファン","いい結果です。もう一度挑戦すると満点が狙えます。"]
   :["入門者","これから見る作品がたくさんあります。もう一度挑戦してみてください。"];
  $("rank").textContent=r[0];$("comment").textContent=r[1];
  const rv=$("review");rv.innerHTML="";
  const esc=x=>x.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  hist.forEach((h,k)=>{
    const d=h.d,url="https://ja.wikipedia.org/w/index.php?search="+encodeURIComponent(d.t);
    const el=document.createElement("div");
    el.className="item "+(h.right?"ok":"ng");
    el.innerHTML=`<div class="st">第${k+1}問　${h.right?"正解":"不正解"}</div><p class="qq">${esc(d.q)}</p><dl><dt>あなたの答え</dt><dd>${esc(h.picked)}</dd><dt>正しい答え</dt><dd>${esc(d.a)}</dd></dl><p class="nt">『${esc(d.t)}』${esc(d.n)}</p><a href="${url}" target="_blank" rel="noopener noreferrer">『${esc(d.t)}』を調べる（Wikipedia）</a>`;
    rv.appendChild(el);
  });
  window.scrollTo(0,0);
}
$("start").onclick=begin;$("again").onclick=begin;
</script>
</body>
</html>
